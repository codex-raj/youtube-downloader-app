<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TubeClone</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <button class="menu-btn" id="menu-btn">☰</button>
        <div class="logo">▶ TubeClone</div>
      </div>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search videos..." />
        <button id="search-btn">Search</button>
      </div>
      <div class="header-right">
        <button class="icon-btn">🔔</button>
        <div class="avatar">U</div>
      </div>
    </header>

    <div class="body">
      <aside class="sidebar">
        <div class="sidebar-item active">🏠 Home</div>
        <div class="sidebar-item">🔥 Trending</div>
        <div class="sidebar-item">📂 Subscriptions</div>
        <hr />
        <div class="sidebar-item">📈 Shorts</div>
        <div class="sidebar-item">🎮 Gaming</div>
        <div class="sidebar-item">📰 News</div>
        <div class="sidebar-item">🎵 Music</div>
        <div class="sidebar-item">📚 Learn</div>
      </aside>

      <main class="main">
        <div class="player-area" id="player-area">
          <div class="player-placeholder" id="player-placeholder">
            <div class="play-icon">▶</div>
            <p>Select a video or paste a link to start</p>
          </div>
          <div class="video-wrapper hidden" id="video-wrapper">
            <video id="video" controls preload="metadata"></video>
            <div id="player" class="hidden"></div>
            <div class="video-info" id="video-info">
              <h3 id="video-title"></h3>
              <p id="video-channel"></p>
            </div>
          </div>
        </div>

        <div class="link-box">
          <input type="text" id="link-input" placeholder="Paste YouTube link here..." />
          <button id="load-btn">Load</button>
          <button id="download-btn" class="download-btn">⬇ Download</button>
        </div>
        <div class="msg" id="msg"></div>

        <div class="video-grid" id="video-grid"></div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
